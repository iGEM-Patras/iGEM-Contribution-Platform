name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an in-flight production deploy finish rather than cancelling it midway.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Repository *variables*, not secrets (Settings → Secrets and variables →
    # Actions → Variables). All three are public by design — they end up inside
    # the published bundle no matter what, because Vite inlines every VITE_*
    # value. The Airtable token is deliberately absent: it lives in the
    # Cloudflare Worker. Never add it here.
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}

    steps:
      - uses: actions/checkout@v4

      # A build with these unset succeeds and publishes a site whose form fails
      # on the first click — the exact failure this project already shipped
      # once. Fail here instead, where the cause is obvious.
      - name: Verify build configuration
        run: |
          missing=""
          [ -n "$VITE_API_URL" ] || missing="$missing VITE_API_URL"
          [ -n "$VITE_CLOUDINARY_CLOUD_NAME" ] || missing="$missing VITE_CLOUDINARY_CLOUD_NAME"
          [ -n "$VITE_CLOUDINARY_UPLOAD_PRESET" ] || missing="$missing VITE_CLOUDINARY_UPLOAD_PRESET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          echo "API endpoint: $VITE_API_URL"

      # Non-empty is not the same as correct. A VITE_API_URL with a typo in it
      # passes every check above, gets inlined into the bundle, and produces a
      # site whose form fails on the first click — which is exactly what this
      # project shipped when the Worker subdomain was left out of the variable.
      #
      # Vite bakes this value in at build time, so a wrong value cannot be fixed
      # without a rebuild. Two seconds of curl here is worth more than a green
      # checkmark on a broken deploy.
      - name: Verify the API endpoint answers
        run: |
          if ! body=$(curl -fsS --max-time 15 "${VITE_API_URL%/}/health"); then
            echo "::error::$VITE_API_URL/health is unreachable. Deploy blocked."
            echo "Check the VITE_API_URL variable for a typo, and that the Worker is deployed."
            exit 1
          fi
          echo "$body"
          case "$body" in
            *'"ok":true'*) echo "Worker is healthy." ;;
            *) echo "::error::$VITE_API_URL/health answered, but not as the gallery API."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Last line of defence. If an Airtable personal access token ever reaches
      # the bundle, this stops the deploy before it becomes public. Rotate the
      # token immediately if this ever fires.
      - name: Assert no Airtable token in the bundle
        run: |
          if grep -rlE 'pat[A-Za-z0-9]{13,}\.' dist/; then
            echo "::error::An Airtable token was found in the build output. Deploy blocked."
            exit 1
          fi
          echo "No Airtable credential in dist/ — safe to publish."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
